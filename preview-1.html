<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Style 1: Potion Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #b8f0b0;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      image-rendering: pixelated;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .crt-glow {
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 120px rgba(100, 200, 100, 0.05);
      pointer-events: none;
      z-index: 99;
    }

    .container {
      max-width: 640px;
      width: 100%;
      border: 4px solid #3a5a3a;
      padding: 2rem;
      background: #0d0d18;
      box-shadow:
        0 0 20px rgba(100, 255, 100, 0.05),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 20px;
      color: #7df07a;
      text-shadow: 0 0 10px rgba(100, 240, 100, 0.4);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .sigil {
      text-align: center;
      font-size: 24px;
      margin: 1.5rem 0;
      color: #9a70d0;
      text-shadow: 0 0 12px rgba(154, 112, 208, 0.5);
    }

    .prompt::before {
      content: "> ";
      color: #7df07a;
    }

    .prompt {
      margin: 0.8rem 0;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #b8f0b0;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    nav {
      margin-top: 2rem;
      border-top: 2px dashed #3a5a3a;
      padding-top: 1.5rem;
    }

    nav a {
      display: block;
      color: #9a70d0;
      text-decoration: none;
      padding: 0.5rem 0;
      transition: color 0.1s;
    }

    nav a:hover {
      color: #d0a0ff;
      text-shadow: 0 0 8px rgba(208, 160, 255, 0.5);
    }

    nav a::before {
      content: "* ";
      color: #3a5a3a;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="crt-glow"></div>
  <div class="container">
    <div class="sigil">+ * +</div>
    <h1>ATELIER</h1>
    <p class="prompt">Welcome, wanderer.</p>
    <p class="prompt">This is a place of making.</p>
    <p class="prompt">Of small spells and careful craft.</p>
    <p class="prompt"><span class="cursor"></span></p>
    <nav>
      <a href="#">Grimoire</a>
      <a href="#">Workshop</a>
      <a href="#">Familiar</a>
      <a href="#">Scrying Pool</a>
    </nav>
  </div>
</body>
</html>
